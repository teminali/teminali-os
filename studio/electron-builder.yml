appId: os.teminali.app
productName: Teminali OS

directories:
  output: release
  buildResources: build

afterPack: build/afterPack.cjs
# Renames the macOS disk images so they say Apple Silicon and Intel. See the
# hook, and the `publish: null` under `dmg` that makes it safe.
afterAllArtifactBuild: build/afterAllArtifactBuild.cjs

files:
  - dist/**/*
  - electron/**/*
  # The whole gateway, not a hand-picked handful of modules.
  #
  # `files` is an allowlist. It used to name four server modules — the ones the
  # menu bar items import directly — which meant the packaged app shipped with
  # no backend at all: nothing served /api, so every chat failed with "the local
  # gateway session could not be created", and server/updates.js was absent so
  # the app could not even check for the release that fixes it. The gateway is
  # 30 files that import nothing but Node builtins and each other, so there is
  # no reason to enumerate them.
  - server/**/*
  # server/speech-local.js needs voice-runtime/lexicon.js, and it CANNOT come
  # from here. electron-builder drops any `files` entry whose source is also an
  # extraResources `from:` — voice-runtime is one, so the pattern is silently
  # ignored and the asar ships without it. That was verified by adding
  # `voice-runtime/lexicon.js` here and finding zero voice-runtime entries in
  # the built archive.
  #
  # server/sidecar-paths.js resolves it at runtime instead, the same way
  # electron/main.cjs finds cli.js: the in-package path in a checkout, and
  # <Resources>/voice-runtime when packaged.
  - package.json
  - "!**/*.map"
  - "!server/**/*.test.js"

# (The pointer helper ships as a macOS extra resource — see `mac.extraResources`
# below. It is scoped there rather than declared globally because the directory
# does not exist on a Windows or Linux runner, and a top-level entry makes both
# of those builds warn about a missing source on every run. A platform block's
# `extraResources` is added to this list, not substituted for it —
# app-builder-lib's getFileMatchers reads both, and a build with the gateway
# entry in both places copied it twice — so nothing here needs repeating.)

icon: build/icon.png

# The MCP shim is spawned as its own process, and nothing can be spawned from
# inside an asar archive. server/video-mcp.js rewrites the path it hands the
# agent CLIs to point at this unpacked copy; unpack it or every tool call from
# the Claude Code and Codex engines fails with ENOENT.
asarUnpack:
  - electron/videoMcpStdio.cjs
  # Spawned as its own process by the agent CLI, so it has to be a real
  # file on disk. Inside app.asar nothing can spawn it; `screenShimPath()`
  # rewrites the path to the unpacked copy and this is what unpacks it.
  - electron/screenMcpStdio.cjs
  # Same again: `workspaceShimPath()` rewrites to the unpacked copy.
  - electron/workspaceMcpStdio.cjs
  # And again for the camera. This line was missing until v0.0.2:
  # `cameraShimPath()` rewrote the path to app.asar.unpacked like the other
  # three, but nothing unpacked the file, so the agent CLI was told to spawn
  # something that did not exist and the server died on start — the model
  # reported "teminali-camera failed to connect (Connection closed)" and
  # answered questions about the operator from screenshots instead of the
  # webcam. tests/asar-unpack.test.mjs now fails if a shim rewrite has no
  # matching entry here.
  - electron/cameraMcpStdio.cjs
  # And the browser panel's page tools: `browserShimPath()` rewrites the same
  # way, so this line is what keeps `page_snapshot` from being the next
  # "failed to connect" in a packaged build.
  - electron/browserMcpStdio.cjs

# server/gateway.js imports "../../gateway/frontier-runner.js" — the one module
# under server/ that reaches outside this package. From inside the archive that
# path resolves to <Resources>/gateway/frontier-runner.js, so the directory is
# copied there rather than into the asar. It cannot go in `files`: that only
# collects paths under the app directory.
extraResources:
  - from: ../gateway
    to: gateway
    filter:
      - "**/*.js"
      - "**/*.json"
      - "!**/*.test.js"
      - "!fixtures/**"
  # server/licence.js imports "../../licence/format.js" for the same reason and
  # by the same route. Only the verifying half lives there — the signer stays in
  # billing/, which is deployed to a server and never packaged, so no build of
  # this app carries the code that mints entitlements.
  #
  # `to:` is not optional and is not decoration. Each entry needs its own, and
  # an entry written above another one's `to:` silently takes it: that is how
  # the gateway came to be copied to the resources root with no filter while
  # the licence landed on top of the path the gateway is imported from.
  - from: ../licence
    to: licence
    filter:
      - "**/*.js"
      - "**/*.json"
      - "!**/*.test.js"
      - "!fixtures/**"
  # The local speech sidecar's source. It is a child process, not an import —
  # onnxruntime's native binding cannot be loaded from inside an asar, so
  # electron/main.cjs spawns cli.js from <Resources>/voice-runtime under this
  # Electron binary with ELECTRON_RUN_AS_NODE=1, the way the MCP shim runs. It
  # cannot go in `files` for the same reason the gateway cannot: `files` is
  # the archive.
  #
  # Its node_modules are deliberately NOT carried by this entry, and cannot
  # be: electron-builder's copier skips a directory named node_modules at the
  # root of any `from:` (app-builder-lib/out/util/filter.js, "filter the root
  # node_modules"), whatever the filter says — the first build with a
  # `node_modules/**` pattern here shipped nine source files and nothing else.
  # They ship from an entry rooted at voice-runtime/node_modules instead, one
  # per platform block below, because each platform keeps only the
  # onnxruntime binaries it can run and a top-level entry applies everywhere.
  - from: voice-runtime
    to: voice-runtime
    filter:
      - "*.js"
      - "package.json"


publish:
  provider: github
  owner: teminali
  repo: releases
  releaseType: release

# ── macOS ──────────────────────────────────────────────────────────
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  # `Teminali-OS`, spelled out, rather than ${productName} — which is
  # "Teminali OS", with a space GitHub will not accept in an asset name. GitHub
  # substitutes a dot, and electron-builder only anticipates that for the
  # artifact itself: it computes a safe name for the .zip and uploads under it,
  # but the .zip.blockmap beside it goes up under the name on disk and lands as
  # `Teminali.OS-...zip.blockmap`.
  #
  # That one dot cost the whole macOS build of v0.0.3. Re-running the job made
  # electron-builder look for `Teminali OS-...zip.blockmap` to overwrite, miss
  # it because GitHub is holding a dotted name, upload instead, and take a 422
  # `already_exists` — four times, then the run died, after the DMGs were up but
  # before it had finished. A published release cannot be rebuilt as long as any
  # asset name round-trips differently from the name on disk.
  #
  # Naming it safely here costs nothing: the uploaded names are byte-identical
  # to what v0.0.3 already published. Only the blockmaps change, from
  # `Teminali.OS-` to `Teminali-OS-`. The DMG volume title below keeps the space
  # — that one is read by a person, not by an API.
  artifactName: Teminali-OS-${version}-macOS-${arch}.${ext}
  darkModeSupport: true
  gatekeeperAssess: false
  # Generated by build/afterPack.cjs, which runs before either signing route:
  # entitlements.mac.plist plus the WebAuthn keychain access group, whose team
  # ID prefix exists only as a CI secret and cannot be checked in. Without
  # APPLE_TEAM_ID it is a copy of the source. See electron/webauthnGroup.cjs.
  entitlements: build/entitlements.mac.generated.plist
  entitlementsInherit: build/entitlements.mac.generated.plist
  # macOS will not execute a binary from inside an asar archive, so the pointer
  # helper ships beside the app where server/pointer.js can spawn it.
  extraResources:
    - from: native/macos/bin
      to: pointer
      filter:
        - teminali-pointer
    # The sidecar's dependencies, pruned to this platform and architecture.
    # onnxruntime-node ships a binary for every platform in its bin/ tree, so
    # the ones a build cannot run are dropped; ${arch} expands to arm64 or
    # x64, which are onnxruntime-node's directory names. The models are not
    # here either: transformers.js caches weights in a `.cache` directory
    # inside its own package — on a developer's machine, whatever that machine
    # has already pulled — and the packaged sidecar is handed a directory
    # under userData instead (TEMINALI_VOICE_CACHE, set by main.cjs, read by
    # voice-runtime/cli.js). They download on first run; /status reports each
    # model as it becomes ready.
    #
    # The sidecar's own top-level onnxruntime-node is not shipped: nothing
    # imports it. @huggingface/transformers pins a different version and
    # carries its own copy under its node_modules, which is the one that
    # loads. voice-runtime/node_modules exists only after
    # `npm run voice:install`; a build made without it ships the source alone
    # and the packaged sidecar exits at its first import — the app logs that
    # and keeps the built-in engine, as it did before the sidecar shipped.
    - from: voice-runtime/node_modules
      to: voice-runtime/node_modules
      filter:
        - "**/*"
        - "!.bin/**"
        - "!**/.cache/**"
        - "!**/*.map"
        - "!**/*.md"
        - "!**/*.d.ts"
        # The web half of transformers.js: 91 MB the Node sidecar never loads.
        # Its package `exports` resolve the `node` condition to
        # dist/transformers.node.mjs, which requires onnxruntime-node and
        # onnxruntime-common and nothing else — never onnxruntime-web, nor the
        # WASM backend that `ort-wasm-simd-threaded.jsep.wasm` and the
        # transformers.web bundles exist to drive. Dropping all of it takes the
        # sidecar's payload from 186 MB to 95 MB on every platform, which is
        # what NSIS has to push through a hardcoded `-mx=9` on Windows.
        #
        # Verified by deleting the three of them outright and running a real
        # Whisper transcription and a real Kokoro generation against the cached
        # weights: both succeeded. Import resolution alone does not prove this —
        # the backend is chosen when a session is created, not when the module
        # is imported.
        - "!**/onnxruntime-web/**"
        - "!**/transformers/dist/transformers.web*"
        - "!**/transformers/dist/*.wasm"
        - "!**/onnxruntime-node/bin/**/linux/**"
        - "!**/onnxruntime-node/bin/**/win32/**"
        - "!**/onnxruntime-node/bin/**/darwin/*/**"
        - "**/onnxruntime-node/bin/**/darwin/${arch}/**"
        # Last, so the re-include above cannot bring it back: a later pattern
        # wins, and the root copy has the same bin/ layout as the nested one.
        - "!onnxruntime-node/**"
  # macOS refuses the microphone and the camera outright, without a dialog, if
  # the reason is not declared. Screen Recording and Accessibility need no key
  # — they are granted only in System Settings, by hand, and cannot be
  # prompted around.
  extendInfo:
    NSMicrophoneUsageDescription: >-
      Teminali OS listens when you press its microphone or its shortcut, so
      you can dictate and ask about what is on your screen.
    NSCameraUsageDescription: >-
      Teminali OS takes a single photograph with your camera when you ask its
      assistant to look at you, and only after you approve that request.
    NSAppleEventsUsageDescription: >-
      Teminali OS reads the controls of the application in front so its
      assistant can point at them by name rather than guessing where they are.

dmg:
  # Space-free for the reason spelled out under `mac.artifactName`.
  artifactName: Teminali-OS-${version}-macOS-${arch}.${ext}
  # No ${arch}: it expanded to "-arm64", so mounting the Apple Silicon image
  # opened a volume called "Teminali OS 1.1.0 -arm64" — contradicting the file
  # the reader just chose, in the machine vocabulary the rename exists to avoid.
  # It cannot say "Apple Silicon" instead: the volume name is baked in when the
  # image is built and the template cannot branch on architecture either. It is
  # dropped rather than translated because by the time a volume is mounted the
  # architecture has already been chosen. The cost is that mounting both at once
  # makes macOS append a "1" to the second.
  title: ${productName} ${version}
  # The window a person sees after mounting the image: the app on the left, the
  # Applications link on the right, and a drawn arrow between them on the
  # background. Coordinates are icon centres and match the arrow in
  # scripts/installer-art.sh; the @2x file beside the background is picked up
  # for Retina displays on its own.
  background: build/dmg-background.png
  window:
    width: 660
    height: 400
  iconSize: 128
  contents:
    - x: 180
      y: 190
      type: file
    - x: 480
      y: 190
      type: link
      path: /Applications
  # `${arch}` above still writes arm64 and x64; build/afterAllArtifactBuild.cjs
  # rewrites those two to Apple-Silicon and Intel once every artifact is built.
  #
  # The rename can only be done after the fact, so the builder must not be the
  # one uploading these: it schedules each upload as soon as the file appears
  # and awaits them after the hook, which would race the rename. `publish: null`
  # is electron-builder's documented "build it, do not publish it" — the hook
  # returns the renamed paths and those are uploaded in their place. It also
  # keeps the DMGs out of latest-mac.yml, which would otherwise list names that
  # no longer exist. Nothing reads that file: this app updates through
  # server/updates.js against the GitHub API, not electron-updater.
  publish: null

# ── Windows ────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch:
        - x64
  # Space-free for the reason spelled out under `mac.artifactName`. NSIS emits
  # a .exe.blockmap too, so Windows carries the identical re-run trap; it has
  # simply never been observed, because no Windows job has ever finished.
  artifactName: Teminali-OS-Setup-${version}-Windows-${arch}.${ext}
  # THE SIDECAR IS NOT PACKED ON WINDOWS. Deliberate, and load-bearing.
  #
  # `voice-runtime/node_modules` is 573 MB after filtering, and packing it into
  # the NSIS archive is the step that has never finished on this platform: not
  # in 0.0.2 (2h31m), not in 0.0.3, and not in 0.0.5, which was killed by the
  # 60-minute cap 58 minutes after the last line it printed. macOS and Linux
  # pack the identical payload in about four minutes and two minutes; Windows
  # is the only target that goes through LZMA.
  #
  # Proven, not suspected: run `34122224708` dropped this one entry and nothing
  # else, on the same runner and the same commit base, and Windows finished in
  # **2m59s** with a 157 MB installer. The compression level, the differential
  # package and `useZip` were each tested separately and each failed to help.
  #
  # Without it the app runs and local speech degrades rather than breaks —
  # `server/speech-local.js:105` imports the lexicon with `.catch(() => null)`
  # and carries on, warning that transcripts will not be vocabulary-repaired,
  # and the local recogniser is already optional (`whisper.cpp is not
  # installed` is a supported state, not a crash).
  #
  # This is the stop-gap, not the answer. The answer is fetching the sidecar in
  # the installer wizard — `inetc::get`, the way electron-builder's own
  # `webPackage.nsh` does it — so Windows gets the feature back without the
  # packaging cost. Until that lands, this is what a downloadable Windows build
  # costs. See `studio/docs/WINDOWS_PACKAGING.md`.

# The assisted (multi-page) installer, with its own welcome and finish pages.
# build/installer.nsh holds the pages; scripts/installer-art.sh draws the two
# bitmaps. NSIS wants them as uncompressed 24-bit BMP at exactly 164×314 and
# 150×57 — the script sets both, and a PNG or an alpha channel here renders as
# a black rectangle rather than failing the build.
nsis:
  # Paying for delta updates this application cannot use.
  #
  # `isBuildDifferentialAware` is true by default, and it does two expensive
  # things to the app-64.7z that no other platform pays for. It hands the
  # archiver `configureDifferentialAwareArchiveOptions`, which forces
  # `-ms=off` — every one of the 1,027 shipped files compressed on its own,
  # with a 1 MB dictionary — and it then walks the finished archive to build a
  # block map. macOS and Linux packaged the identical payload in 3m38s and
  # 2m26s; Windows has never finished it at all, in any release.
  #
  # The whole point of that work is downloading only the changed blocks, and
  # this updater does not: `server/updates.js` replaces the entire .dmg / .exe
  # rather than patching in place. So it is spending the one platform-specific
  # cost we have on a capability nothing reads. False makes the archive solid
  # again and skips the block map (`NsisTarget.js` lines 66, 87 and 308).
  #
  # The other half of the same fix is `ELECTRON_BUILDER_COMPRESSION_LEVEL=1`
  # in the release workflow, which was already there for v0.0.5 — the first
  # Windows build ever to carry it. Whether level 1 alone would have finished
  # is not known: it was still inside this step 35 minutes in, which is why
  # this went in beside it rather than after it.
  differentialPackage: false
  # Deflate, not LZMA, for the payload archive.
  #
  # `differentialPackage: false` above is what makes this reachable at all —
  # `NsisTarget.js:78` picks the format as `!isBuildDifferentialAware &&
  # useZip ? "zip" : "7z"`, so the two only work as a pair. What it buys is the
  # difference between LZMA and Deflate over a 573 MB payload on a two-core
  # runner, which is the one number that separates this platform from the two
  # that finish.
  #
  # It is a guess with a mechanism, not a diagnosis: v0.0.5 proved the
  # compression LEVEL was not the problem (level 1 was in effect and the step
  # still ran 58 minutes to its cap), and nothing yet proves the compression
  # METHOD is. That is what DEBUG=electron-builder on the Windows runner is
  # for — it prints the 7za command line and the signtool invocation, so the
  # next hang names itself instead of being inferred from silence.
  useZip: true
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Teminali OS
  uninstallDisplayName: Teminali OS
  runAfterFinish: true
  include: build/installer.nsh
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp

# ── Linux ──────────────────────────────────────────────────────────
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Development
  # Space-free for the reason spelled out under `mac.artifactName`.
  artifactName: Teminali-OS-${version}-Linux-${arch}.${ext}
  # The speech sidecar's dependencies, pruned to Linux and ${arch}. See the
  # macOS entry for what each pattern is for.
  extraResources:
    - from: voice-runtime/node_modules
      to: voice-runtime/node_modules
      filter:
        - "**/*"
        - "!.bin/**"
        - "!**/.cache/**"
        - "!**/*.map"
        - "!**/*.md"
        - "!**/*.d.ts"
        # The web half of transformers.js — see the macOS entry.
        - "!**/onnxruntime-web/**"
        - "!**/transformers/dist/transformers.web*"
        - "!**/transformers/dist/*.wasm"
        - "!**/onnxruntime-node/bin/**/darwin/**"
        - "!**/onnxruntime-node/bin/**/win32/**"
        - "!**/onnxruntime-node/bin/**/linux/*/**"
        - "**/onnxruntime-node/bin/**/linux/${arch}/**"
        # Last, so the re-include above cannot bring it back: a later pattern
        # wins, and the root copy has the same bin/ layout as the nested one.
        - "!onnxruntime-node/**"
  # Named explicitly. Left to itself electron-builder derives this from the
  # package name, which is scoped — "@teminali/os" becomes "@teminalios",
  # and an "@" is not legal in a Linux executable path. The AppImage build fails
  # outright rather than warning.
  executableName: teminali-os
  # Copies `desktopName` out of package.json into the .desktop entry. Without
  # the pair, desktop environments cannot associate a running window with its
  # entry and the app takes a generic icon. The name itself lives in
  # package.json because that is where electron-builder 26 reads it from.
  syncDesktopName: true
