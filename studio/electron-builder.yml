appId: code.teminali.app
productName: Teminali Code

directories:
  output: release
  buildResources: build

afterPack: build/afterPack.cjs
# Renames the macOS disk images so they say Apple Silicon and Intel. See the
# hook, and the `publish: null` under `dmg` that makes it safe.
afterAllArtifactBuild: build/afterAllArtifactBuild.cjs

files:
  - dist/**/*
  - electron/**/*
  # The whole gateway, not a hand-picked handful of modules.
  #
  # `files` is an allowlist. It used to name four server modules — the ones the
  # menu bar items import directly — which meant the packaged app shipped with
  # no backend at all: nothing served /api, so every chat failed with "the local
  # gateway session could not be created", and server/updates.js was absent so
  # the app could not even check for the release that fixes it. The gateway is
  # 30 files that import nothing but Node builtins and each other, so there is
  # no reason to enumerate them.
  - server/**/*
  - package.json
  - "!**/*.map"
  - "!server/**/*.test.js"

# (The pointer helper ships as a macOS extra resource — see `mac.extraResources`
# below. It is scoped there rather than declared globally because the directory
# does not exist on a Windows or Linux runner, and a top-level entry makes both
# of those builds warn about a missing source on every run. A platform block's
# `extraResources` is added to this list, not substituted for it —
# app-builder-lib's getFileMatchers reads both, and a build with the gateway
# entry in both places copied it twice — so nothing here needs repeating.)

icon: build/icon.png

# The MCP shim is spawned as its own process, and nothing can be spawned from
# inside an asar archive. server/video-mcp.js rewrites the path it hands the
# agent CLIs to point at this unpacked copy; unpack it or every tool call from
# the Claude Code and Codex engines fails with ENOENT.
asarUnpack:
  - electron/videoMcpStdio.cjs
  # Spawned as its own process by the agent CLI, so it has to be a real
  # file on disk. Inside app.asar nothing can spawn it; `screenShimPath()`
  # rewrites the path to the unpacked copy and this is what unpacks it.
  - electron/screenMcpStdio.cjs
  # Same again: `workspaceShimPath()` rewrites to the unpacked copy.
  - electron/workspaceMcpStdio.cjs

# server/gateway.js imports "../../gateway/frontier-runner.js" — the one module
# under server/ that reaches outside this package. From inside the archive that
# path resolves to <Resources>/gateway/frontier-runner.js, so the directory is
# copied there rather than into the asar. It cannot go in `files`: that only
# collects paths under the app directory.
extraResources:
  - from: ../gateway
    to: gateway
    filter:
      - "**/*.js"
      - "**/*.json"
      - "!**/*.test.js"
      - "!fixtures/**"
  # server/licence.js imports "../../licence/format.js" for the same reason and
  # by the same route. Only the verifying half lives there — the signer stays in
  # billing/, which is deployed to a server and never packaged, so no build of
  # this app carries the code that mints entitlements.
  #
  # `to:` is not optional and is not decoration. Each entry needs its own, and
  # an entry written above another one's `to:` silently takes it: that is how
  # the gateway came to be copied to the resources root with no filter while
  # the licence landed on top of the path the gateway is imported from.
  - from: ../licence
    to: licence
    filter:
      - "**/*.js"
      - "**/*.json"
      - "!**/*.test.js"
      - "!fixtures/**"
  # The local speech sidecar's source. It is a child process, not an import —
  # onnxruntime's native binding cannot be loaded from inside an asar, so
  # electron/main.cjs spawns cli.js from <Resources>/voice-runtime under this
  # Electron binary with ELECTRON_RUN_AS_NODE=1, the way the MCP shim runs. It
  # cannot go in `files` for the same reason the gateway cannot: `files` is
  # the archive.
  #
  # Its node_modules are deliberately NOT carried by this entry, and cannot
  # be: electron-builder's copier skips a directory named node_modules at the
  # root of any `from:` (app-builder-lib/out/util/filter.js, "filter the root
  # node_modules"), whatever the filter says — the first build with a
  # `node_modules/**` pattern here shipped nine source files and nothing else.
  # They ship from an entry rooted at voice-runtime/node_modules instead, one
  # per platform block below, because each platform keeps only the
  # onnxruntime binaries it can run and a top-level entry applies everywhere.
  - from: voice-runtime
    to: voice-runtime
    filter:
      - "*.js"
      - "package.json"


publish:
  provider: github
  owner: teminali
  repo: releases
  releaseType: release

# ── macOS ──────────────────────────────────────────────────────────
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: ${productName}-${version}-macOS-${arch}.${ext}
  darkModeSupport: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # macOS will not execute a binary from inside an asar archive, so the pointer
  # helper ships beside the app where server/pointer.js can spawn it.
  extraResources:
    - from: native/macos/bin
      to: pointer
      filter:
        - teminali-pointer
    # The sidecar's dependencies, pruned to this platform and architecture.
    # onnxruntime-node ships a binary for every platform in its bin/ tree, so
    # the ones a build cannot run are dropped; ${arch} expands to arm64 or
    # x64, which are onnxruntime-node's directory names. The models are not
    # here either: transformers.js caches weights in a `.cache` directory
    # inside its own package — on a developer's machine, whatever that machine
    # has already pulled — and the packaged sidecar is handed a directory
    # under userData instead (TEMINALI_VOICE_CACHE, set by main.cjs, read by
    # voice-runtime/cli.js). They download on first run; /status reports each
    # model as it becomes ready.
    #
    # The sidecar's own top-level onnxruntime-node is not shipped: nothing
    # imports it. @huggingface/transformers pins a different version and
    # carries its own copy under its node_modules, which is the one that
    # loads. voice-runtime/node_modules exists only after
    # `npm run voice:install`; a build made without it ships the source alone
    # and the packaged sidecar exits at its first import — the app logs that
    # and keeps the built-in engine, as it did before the sidecar shipped.
    - from: voice-runtime/node_modules
      to: voice-runtime/node_modules
      filter:
        - "**/*"
        - "!.bin/**"
        - "!**/.cache/**"
        - "!**/*.map"
        - "!**/*.md"
        - "!**/*.d.ts"
        - "!**/onnxruntime-node/bin/**/linux/**"
        - "!**/onnxruntime-node/bin/**/win32/**"
        - "!**/onnxruntime-node/bin/**/darwin/*/**"
        - "**/onnxruntime-node/bin/**/darwin/${arch}/**"
        # Last, so the re-include above cannot bring it back: a later pattern
        # wins, and the root copy has the same bin/ layout as the nested one.
        - "!onnxruntime-node/**"
  # macOS refuses the microphone outright, without a dialog, if the reason is
  # not declared. Screen Recording and Accessibility need no key — they are
  # granted only in System Settings, by hand, and cannot be prompted around.
  extendInfo:
    NSMicrophoneUsageDescription: >-
      Teminali Code listens when you press its microphone or its shortcut, so
      you can dictate and ask about what is on your screen.
    NSAppleEventsUsageDescription: >-
      Teminali Code reads the controls of the application in front so its
      assistant can point at them by name rather than guessing where they are.

dmg:
  artifactName: ${productName}-${version}-macOS-${arch}.${ext}
  # No ${arch}: it expanded to "-arm64", so mounting the Apple Silicon image
  # opened a volume called "Teminali Code 1.1.0 -arm64" — contradicting the file
  # the reader just chose, in the machine vocabulary the rename exists to avoid.
  # It cannot say "Apple Silicon" instead: the volume name is baked in when the
  # image is built and the template cannot branch on architecture either. It is
  # dropped rather than translated because by the time a volume is mounted the
  # architecture has already been chosen. The cost is that mounting both at once
  # makes macOS append a "1" to the second.
  title: ${productName} ${version}
  # `${arch}` above still writes arm64 and x64; build/afterAllArtifactBuild.cjs
  # rewrites those two to Apple-Silicon and Intel once every artifact is built.
  #
  # The rename can only be done after the fact, so the builder must not be the
  # one uploading these: it schedules each upload as soon as the file appears
  # and awaits them after the hook, which would race the rename. `publish: null`
  # is electron-builder's documented "build it, do not publish it" — the hook
  # returns the renamed paths and those are uploaded in their place. It also
  # keeps the DMGs out of latest-mac.yml, which would otherwise list names that
  # no longer exist. Nothing reads that file: this app updates through
  # server/updates.js against the GitHub API, not electron-updater.
  publish: null

# ── Windows ────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}-Windows-${arch}.${ext}
  # The speech sidecar's dependencies, pruned to Windows and ${arch}. See the
  # macOS entry for what each pattern is for.
  extraResources:
    - from: voice-runtime/node_modules
      to: voice-runtime/node_modules
      filter:
        - "**/*"
        - "!.bin/**"
        - "!**/.cache/**"
        - "!**/*.map"
        - "!**/*.md"
        - "!**/*.d.ts"
        - "!**/onnxruntime-node/bin/**/darwin/**"
        - "!**/onnxruntime-node/bin/**/linux/**"
        - "!**/onnxruntime-node/bin/**/win32/*/**"
        - "**/onnxruntime-node/bin/**/win32/${arch}/**"
        # Last, so the re-include above cannot bring it back: a later pattern
        # wins, and the root copy has the same bin/ layout as the nested one.
        - "!onnxruntime-node/**"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Teminali Code

# ── Linux ──────────────────────────────────────────────────────────
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Development
  artifactName: ${productName}-${version}-Linux-${arch}.${ext}
  # The speech sidecar's dependencies, pruned to Linux and ${arch}. See the
  # macOS entry for what each pattern is for.
  extraResources:
    - from: voice-runtime/node_modules
      to: voice-runtime/node_modules
      filter:
        - "**/*"
        - "!.bin/**"
        - "!**/.cache/**"
        - "!**/*.map"
        - "!**/*.md"
        - "!**/*.d.ts"
        - "!**/onnxruntime-node/bin/**/darwin/**"
        - "!**/onnxruntime-node/bin/**/win32/**"
        - "!**/onnxruntime-node/bin/**/linux/*/**"
        - "**/onnxruntime-node/bin/**/linux/${arch}/**"
        # Last, so the re-include above cannot bring it back: a later pattern
        # wins, and the root copy has the same bin/ layout as the nested one.
        - "!onnxruntime-node/**"
  # Named explicitly. Left to itself electron-builder derives this from the
  # package name, which is scoped — "@teminali/code" becomes "@teminalicode",
  # and an "@" is not legal in a Linux executable path. The AppImage build fails
  # outright rather than warning.
  executableName: teminali-code
  # Copies `desktopName` out of package.json into the .desktop entry. Without
  # the pair, desktop environments cannot associate a running window with its
  # entry and the app takes a generic icon. The name itself lives in
  # package.json because that is where electron-builder 26 reads it from.
  syncDesktopName: true
