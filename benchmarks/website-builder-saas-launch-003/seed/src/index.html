<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevStream — Developer Telemetry</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a href="/" class="brand-logo">DevStream</a>
  </header>

  <main id="main-content">
    <section id="hero" class="hero-section">
      <h1>Real-time Telemetry Ingestion at Microsecond Latency</h1>
      <p class="hero-subtitle">High-throughput event streaming built for distributed systems.</p>
      <a href="#pricing" class="btn btn-primary">View Pricing</a>
      <div class="metrics-grid" id="metrics-container"></div>
    </section>

    <section id="pricing" class="pricing-section">
      <h2>Transparent Pricing for Modern Teams</h2>
      <div class="billing-toggle">
        <span>Monthly</span>
        <span>Annual (Save 20%)</span>
      </div>
      <div class="pricing-grid" id="pricing-container"></div>
    </section>

    <section id="contact" class="contact-section">
      <h2>Get Started with DevStream</h2>
      <form id="lead-form">
        <label for="lead-email">Work Email</label>
        <input id="lead-email" name="email">
        <button type="submit" class="btn btn-primary" id="lead-submit">Request Access</button>
        <div id="form-status" class="status-msg"></div>
      </form>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
