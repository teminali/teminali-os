# Builds Teminali Code for macOS, Windows and Linux and publishes one release.
#
# Each platform is built on its own runner because they do not cross-compile
# honestly: packaging an NSIS installer from macOS needs wine, and a Linux
# AppImage built on a Mac is unreliable in ways that only show up on someone
# else's machine. Three runners is the boring answer and the one that works.
#
# There is no Developer ID certificate yet, so the app is ad-hoc signed by
# build/afterPack.cjs: macOS Gatekeeper warns on first launch, and the in-app
# updater replaces the whole .dmg rather than patching in place — see
# server/updates.js for why that is a constraint rather than a choice.
#
# Signing is wired but pending. The packaging step below already reads every
# variable a real signature needs, and each one arrives empty while the secret
# is absent; electron-builder and afterPack.cjs both read empty as "no
# certificate" and take the ad-hoc path. Adding CSC_LINK, CSC_KEY_PASSWORD and
# the three APPLE_* secrets in repository settings switches this build over to
# a real signature and notarization without touching a file.

name: Release

on:
  push:
    tags: ["v*"]
  # So a build can be rehearsed without cutting a tag.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build without publishing"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    # macOS, not the cheaper Linux runner. Parts of this suite exercise
    # macOS-specific paths — the pointer helper's contract, screencapture,
    # Guardian's telemetry — and running them somewhere they were never proven
    # would either fail the release or pass while checking less than it looks.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
        working-directory: studio
      - run: npm run build:pointer
        working-directory: studio
      - run: npm run typecheck
        working-directory: studio
      - run: npm test
        working-directory: studio

  build:
    name: ${{ matrix.name }}
    # Nothing is published unless the same checks an operator would run by hand
    # have passed. A release whose tests did not run is the thing a release
    # process exists to prevent.
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the two that are already building.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            args: --mac --arm64 --x64
          - os: windows-latest
            name: Windows
            args: --win --x64
          - os: ubuntu-latest
            name: Linux
            args: --linux --x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install
        run: npm ci
        working-directory: studio

      # The screen assistant's pointer helper is Swift and macOS-only. It is
      # compiled here rather than committed: an unsigned Mach-O in git is one
      # nobody can audit. The other two platforms ship without it, and the app
      # reports that honestly instead of failing.
      - name: Build the pointer helper
        if: matrix.os == 'macos-latest'
        run: npm run build:pointer
        working-directory: studio

      - name: Build web assets
        run: npm run build
        working-directory: studio

      - name: Package and publish
        working-directory: studio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pending, and inert while it is — but inert by being UNSET, not by
          # being empty. An absent secret interpolates to an empty string, and
          # electron-builder reads CSC_LINK with `v1 == null ? v2 : v1`, so ""
          # is a value: it resolves as a certificate PATH against the project
          # directory and the build dies with "<projectDir> not a file". That
          # is what failed v1.2.0 on this runner, twice. The run step below
          # unsets both when they arrive empty.
          #
          # Scoped to the macOS runner because CSC_LINK is not a macOS variable —
          # electron-builder hands it to signtool on Windows too, and a Developer
          # ID .p12 would fail that build the day the secret is added.
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.CSC_KEY_PASSWORD || '' }}
          # Otherwise electron-builder searches the runner keychain for any
          # identity it can find. That is a no-op on a runner with no
          # certificate, and it is how a build picks up the wrong one on a
          # runner image that ships with one.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          # Notarization runs only after a successful Developer ID signature, so
          # these stay inert until CSC_LINK exists. All three go together —
          # electron-builder fails the build on a partial set rather than
          # quietly shipping something Gatekeeper will reject.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # `unset`, not `: "${VAR:=}"`. electron-builder distinguishes an empty
        # certificate path from an absent one and only the absent one takes the
        # ad-hoc path, so the variables have to leave this shell's environment
        # entirely. Adding the secrets makes them non-empty and this is a no-op.
        run: |
          if [ -z "${CSC_LINK}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          # Same rule, same reason: notarization reads these as present-or-not,
          # and three empty strings are a set that is present and unusable.
          if [ -z "${APPLE_ID}" ]; then
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npx electron-builder ${{ matrix.args }} \
            --publish ${{ (github.event_name == 'push' && 'always') || 'never' }}

      # On a rehearsal there is no release to attach to, so the artifacts are
      # kept on the run itself — otherwise a dry run produces nothing to look at.
      - name: Keep the artifacts
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          retention-days: 7
          if-no-files-found: error
          path: |
            studio/release/*.dmg
            studio/release/*.zip
            studio/release/*.exe
            studio/release/*.AppImage
