# Builds Teminali Code for macOS, Windows and Linux and publishes one release.
#
# Each platform is built on its own runner because they do not cross-compile
# honestly: packaging an NSIS installer from macOS needs wine, and a Linux
# AppImage built on a Mac is unreliable in ways that only show up on someone
# else's machine. Three runners is the boring answer and the one that works.
#
# There is no Developer ID certificate yet, so the app is ad-hoc signed by
# build/afterPack.cjs: macOS Gatekeeper warns on first launch, and the in-app
# updater replaces the whole .dmg rather than patching in place — see
# server/updates.js for why that is a constraint rather than a choice.
#
# Signing is wired but pending. The packaging step below already reads every
# variable a real signature needs, and each one arrives empty while the secret
# is absent; electron-builder and afterPack.cjs both read empty as "no
# certificate" and take the ad-hoc path. Adding CSC_LINK, CSC_KEY_PASSWORD and
# the three APPLE_* secrets in repository settings switches this build over to
# a real signature and notarization without touching a file.

name: Release

on:
  push:
    tags: ["v*"]
  # So a build can be rehearsed without cutting a tag.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build without publishing"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    # macOS, not the cheaper Linux runner. Parts of this suite exercise
    # macOS-specific paths — the pointer helper's contract, screencapture,
    # Guardian's telemetry — and running them somewhere they were never proven
    # would either fail the release or pass while checking less than it looks.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
        working-directory: studio
      - run: npm run build:pointer
        working-directory: studio
      - run: npm run typecheck
        working-directory: studio
      - run: npm test
        working-directory: studio

  build:
    name: ${{ matrix.name }}
    # Nothing is published unless the same checks an operator would run by hand
    # have passed. A release whose tests did not run is the thing a release
    # process exists to prevent.
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the two that are already building.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            args: --mac --arm64 --x64
          - os: windows-latest
            name: Windows
            args: --win --x64
          - os: ubuntu-latest
            name: Linux
            args: --linux --x64

    steps:
      # Fail here, loudly, rather than thirty minutes later and silently.
      #
      # The publish step falls back to GITHUB_TOKEN when RELEASES_TOKEN is
      # absent, which keeps a fork and a rehearsal building — but GITHUB_TOKEN
      # cannot upload to teminali/releases, so on a real tag that fallback
      # produces a green build that shipped nothing. That is exactly how the
      # public v1.2.8 came to be assembled by hand. A PAT also expires, and the
      # day it does this workflow would go back to succeeding at nothing, with
      # every installed copy of the app quietly never seeing another update.
      #
      # Only on a tag: `workflow_dispatch` is the rehearsal path and is allowed
      # to run without the token.
      - name: Refuse to build a release nobody can download
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error::RELEASES_TOKEN is not set. electron-builder would fall back to GITHUB_TOKEN, which cannot upload to teminali/releases — the build would go green and publish no assets, and every installed app would stop seeing updates. Add a PAT with contents:write on teminali/releases."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install
        run: npm ci
        working-directory: studio

      # The speech sidecar has its own package.json and is not covered by the
      # npm ci above. Without this the packaged app ships voice-runtime's
      # source with no node_modules beside it, and the sidecar cannot start.
      - name: Install the speech sidecar's dependencies
        run: npm run voice:install
        working-directory: studio

      # The screen assistant's pointer helper is Swift and macOS-only. It is
      # compiled here rather than committed: an unsigned Mach-O in git is one
      # nobody can audit. The other two platforms ship without it, and the app
      # reports that honestly instead of failing.
      - name: Build the pointer helper
        if: matrix.os == 'macos-latest'
        run: npm run build:pointer
        working-directory: studio

      - name: Build web assets
        run: npm run build
        working-directory: studio

      - name: Package and publish
        working-directory: studio
        env:
          # electron-builder publishes to teminali/releases, which is a
          # different repository from the one this workflow runs in. The default
          # GITHUB_TOKEN is scoped to *this* repository and cannot create a
          # release or upload an asset anywhere else: the upload fails while the
          # build reports success, which is how the public v1.2.8 came to be
          # assembled by hand seven minutes after CI went green. RELEASES_TOKEN
          # is a PAT with `contents: write` on teminali/releases. The fallback
          # keeps a fork or a rehearsal building — only the upload needs the
          # wider token.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          # Pending, and inert while it is — but inert by being UNSET, not by
          # being empty. An absent secret interpolates to an empty string, and
          # electron-builder reads CSC_LINK with `v1 == null ? v2 : v1`, so ""
          # is a value: it resolves as a certificate PATH against the project
          # directory and the build dies with "<projectDir> not a file". That
          # is what failed v1.2.0 on this runner, twice. The run step below
          # unsets both when they arrive empty.
          #
          # Scoped to the macOS runner because CSC_LINK is not a macOS variable —
          # electron-builder hands it to signtool on Windows too, and a Developer
          # ID .p12 would fail that build the day the secret is added.
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.CSC_KEY_PASSWORD || '' }}
          # Otherwise electron-builder searches the runner keychain for any
          # identity it can find. That is a no-op on a runner with no
          # certificate, and it is how a build picks up the wrong one on a
          # runner image that ships with one.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          # Notarization runs only after a successful Developer ID signature, so
          # these stay inert until CSC_LINK exists. All three go together —
          # electron-builder fails the build on a partial set rather than
          # quietly shipping something Gatekeeper will reject.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # bash on every runner, including Windows, which defaults to PowerShell
        # and cannot parse the guard below — that is a build this workflow has
        # already lost once. Git Bash ships on the Windows image.
        shell: bash
        # `unset`, not `: "${VAR:=}"`. electron-builder distinguishes an empty
        # certificate path from an absent one and only the absent one takes the
        # ad-hoc path, so the variables have to leave this shell's environment
        # entirely. Adding the secrets makes them non-empty and this is a no-op.
        run: |
          if [ -z "${CSC_LINK}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          # Same rule, same reason: notarization reads these as present-or-not,
          # and three empty strings are a set that is present and unusable.
          if [ -z "${APPLE_ID}" ]; then
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npx electron-builder ${{ matrix.args }} \
            --publish ${{ (github.event_name == 'push' && 'always') || 'never' }}

      # On a rehearsal there is no release to attach to, so the artifacts are
      # kept on the run itself — otherwise a dry run produces nothing to look at.
      - name: Keep the artifacts
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          retention-days: 7
          if-no-files-found: error
          path: |
            studio/release/*.dmg
            studio/release/*.zip
            studio/release/*.exe
            studio/release/*.AppImage

  release-notes:
    name: Ensure Release Notes
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Attach release notes
        env:
          # Same token and the same reason: the release these notes belong to
          # lives in teminali/releases.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          # `gh release` defaults to the repository it is run in. Without this
          # the notes land on this repository's release, which is private and
          # which nobody outside can read — that is why the public v1.2.8 shipped
          # with a forty-character body. The git log they are generated from
          # still comes from the checkout above, which is this repository.
          RELEASE_REPO: teminali/releases
        run: |
          set -e
          echo "Checking release notes for $TAG_NAME in $RELEASE_REPO"
          EXISTING_BODY=$(gh release view "$TAG_NAME" --repo "$RELEASE_REPO" --json body --jq .body 2>/dev/null || echo "")

          if [ -z "$(echo "$EXISTING_BODY" | tr -d '[:space:]')" ]; then
            echo "Release body is empty. Generating release notes..."
            PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || echo "")

            NOTES_FILE="release_notes.md"
            echo "## What's Changed in $TAG_NAME" > "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"

            if [ -n "$PREV_TAG" ]; then
              echo "### Changes since $PREV_TAG:" >> "$NOTES_FILE"
              git log "${PREV_TAG}..${TAG_NAME}" --pretty=format:"* %s (%h)" --no-merges >> "$NOTES_FILE"
            else
              echo "### Recent Changes:" >> "$NOTES_FILE"
              git log -n 15 --pretty=format:"* %s (%h)" --no-merges >> "$NOTES_FILE"
            fi

            echo "" >> "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"

            gh release edit "$TAG_NAME" --repo "$RELEASE_REPO" \
              --title "Teminali Code ${TAG_NAME#v}" --notes-file "$NOTES_FILE"
            echo "Release notes successfully published for $TAG_NAME!"
          else
            echo "Release notes already exist for $TAG_NAME."
          fi

